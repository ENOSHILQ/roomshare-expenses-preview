<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f4f7f8">
<title>共同生活費 v0.9｜Google・メール認証導線（未承認）</title>
<style>
:root{--bg:#f4f7f8;--surface:white;--ink:#182932;--muted:#77858b;--teal:#16786d;--deep:#115d55;--pale:#e7f4f1;--line:#e1e9eb}*{box-sizing:border-box}
body{margin:0;background:#e5eaed;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #71bdb1;outline-offset:2px}
.app{max-width:430px;height:100dvh;min-height:490px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 45px #20343e15;overflow:hidden}
.header{padding:calc(15px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--line);background:#f9fbfb;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:18px;font-weight:800;letter-spacing:-.04em}.subhead{font-size:11px;color:var(--muted);margin-top:2px}.chip{border-radius:999px;padding:6px 9px;background:var(--pale);color:var(--deep);font-size:10px;font-weight:750}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:21px 20px 126px;overscroll-behavior:contain}.scroll:focus{outline:none}
h1{font-size:23px;letter-spacing:-.04em;margin:0 0 7px}h2{font-size:15px;margin:0}p{line-height:1.65;margin:0}.muted{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid #edf1f2;border-radius:19px;padding:17px 16px;margin:13px 0;box-shadow:0 4px 19px #213b4310}.card.soft{background:#edf7f4;border-color:#e5f2ee}.amount{font-size:31px;font-weight:850;letter-spacing:-.045em;margin-top:3px}.total{display:grid;grid-template-columns:1fr 1fr;gap:9px}.total .card{margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>*{min-width:0}.bigcard{border-radius:22px;background:linear-gradient(135deg,#197c70,#0f6057);padding:23px 20px;color:#fff;margin:14px 0}.bigcard .amount{font-size:36px}.bigcard .muted{color:#d2eae4}.sep{height:1px;background:var(--line);margin:13px 0}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.btn{border:0;background:var(--teal);color:white;border-radius:12px;padding:13px 17px;font-weight:750;min-height:44px}.btn.alt{background:var(--pale);color:var(--deep)}.btn.grey{background:#f0f2f4;color:#334650}.btn.ghost{background:transparent;color:var(--deep);border:1px solid #d5e7e2}.btn.block{width:100%;display:block}.buttons{display:grid;gap:9px;margin:14px 0}
.input{border:1px solid #dbe4e7;border-radius:11px;background:white;padding:12px;width:100%;min-height:44px;color:#182932}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:720;color:#4c5d66}.badge{font-size:10px;border-radius:999px;padding:4px 8px;background:#ecf2f4;color:#50616b}
.nav{display:none;flex:0 0 auto;grid-template-columns:repeat(5,1fr);padding:10px 7px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #dbe5e8}.nav.visible{display:grid}
.nav button{background:none;border:0;padding:5px 2px;min-height:49px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#93a0a4;font-size:10px;font-weight:700}.nav button.active{color:var(--teal)}.nav .symbol{font-size:20px;line-height:24px}
.fab{position:absolute;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--teal);color:white;font-size:34px;line-height:1;font-weight:300;box-shadow:0 9px 24px #125e5850;display:none;z-index:5}.fab.visible{display:block}
.info{font-size:12px;padding:11px 12px;border-radius:10px;background:#fff5e5;color:#76501b;margin:13px 0;line-height:1.6}.notice{padding:10px 12px;background:#eaf5f2;color:#195f55;border-radius:10px;font-size:12px;margin:12px 0;line-height:1.6}.err{padding:11px 12px;background:#fff0ee;color:#9c3535;border-radius:10px;margin:12px 0;font-size:12px}
.dialog{position:absolute;inset:0;display:none;z-index:9;align-items:end;background:#122a3588}.dialog.visible{display:flex}.sheet{width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;background:#fff;padding:20px 20px calc(22px + env(safe-area-inset-bottom))}.sheet h2{font-size:20px}.sheet .row{margin-bottom:15px}.small{font-size:11px;color:var(--muted);line-height:1.55}.link{overflow-wrap:anywhere;line-height:1.5;font-size:12px;color:var(--deep);padding:10px;background:#f2f7f6;border-radius:10px}.notice strong{font-weight:800}
@media(max-width:350px){.scroll{padding:16px 15px 122px}.header{padding-left:15px;padding-right:15px}.fab{width:56px;height:56px;right:15px;bottom:calc(85px + env(safe-area-inset-bottom))}.bigcard .amount{font-size:30px}}
</style>
<script src="./config.js"></script>
</head><body>
<div class="app">
<header class="header"><div><div class="brand">共同生活費 <span class="badge">v0.9</span></div><div class="subhead">開発用クラウド接続／認証設定待ち</div></div><div class="chip" id="mode-badge">確認中</div></header>
<main class="scroll" id="content" tabindex="-1"><p class="muted">起動しています…</p></main>
<button id="fab" class="fab" aria-label="支出を追加" title="支出を追加">+</button>
<nav id="nav" class="nav" aria-label="主要メニュー">
<button data-tab="home"><span class="symbol">⌂</span>ホーム</button>
<button data-tab="expenses"><span class="symbol">▤</span>支出</button>
<button data-tab="settlement"><span class="symbol">⇄</span>精算</button>
<button data-tab="history"><span class="symbol">◷</span>履歴</button>
<button data-tab="settings"><span class="symbol">⚙</span>設定</button>
</nav>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
</div>
<script type="module" src="./app.js"></script>
</body></html>
